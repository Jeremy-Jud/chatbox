<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:; img-src 'self' data: blob:">
  <title>WhatsUp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6zM12 13v7"/></symbol>
      <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
      <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 14.5c1.5 1.5 4.5 1.5 6 0M9.5 10h0M14.5 10h0"/></symbol>
      <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7-7L13 4.5a3.3 3.3 0 0 1 4.7 4.7l-7.8 7.8a1.7 1.7 0 0 1-2.3-2.4L14.8 7.4"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="10" height="10" rx="2"/><path d="M5 15V7a2 2 0 0 1 2-2h8"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    </defs>
  </svg>

  <header class="titlebar">
    <button id="backBtn" class="ic hidden" title="Zurück"><svg><use href="#i-back"/></svg></button>
    <div class="title"><img src="assets/logo.png" class="tb-logo" alt=""><span id="titleText">WhatsUp</span><span class="dot" id="netDot" title="Netzwerk"></span></div>
    <button id="trophyBtn" class="ic" title="Erfolge"><svg><use href="#i-trophy"/></svg></button>
    <button id="settingsBtn" class="ic" title="Einstellungen"><svg><use href="#i-gear"/></svg><span id="updateDot" class="update-dot hidden"></span></button>
    <button id="pinBtn" class="ic" title="Immer im Vordergrund"><svg><use href="#i-pin"/></svg></button>
    <button id="minBtn" class="ic" title="Minimieren"><svg><use href="#i-min"/></svg></button>
    <button id="closeBtn" class="ic close" title="Schließen"><svg><use href="#i-x"/></svg></button>
  </header>

  <!-- Erster Start -->
  <section id="viewSetup" class="view hidden">
    <div class="setup">
      <img src="assets/logo.png" class="logo" alt="WhatsUp-Logo">
      <h1>WhatsUp</h1>
      <input id="setupName" maxlength="24" placeholder="Dein Name" autocomplete="off">
      <button id="setupBtn" class="primary">Weiter</button>
    </div>
  </section>

  <!-- Chats -->
  <section id="viewList" class="view hidden">
    <div class="me">
      <button id="meCardBtn" class="me-main" title="Profil bearbeiten">
        <span id="meAvatar"></span>
        <span class="me-info">
          <span class="fname" id="meName"></span>
          <span class="flast">Code <span class="code-sm" id="myCode">------</span></span>
        </span>
      </button>
      <button id="copyBtn" class="ic" title="Code kopieren"><svg><use href="#i-copy"/></svg></button>
    </div>
    <form id="addForm" class="add">
      <input id="addInput" maxlength="6" placeholder="Code hinzufügen" autocomplete="off">
      <button class="ic" type="submit" title="Hinzufügen"><svg><use href="#i-plus"/></svg></button>
    </form>
    <div id="addStatus" class="status"></div>
    <div class="listhead">
      <span>Chats</span>
      <button id="newGroupBtn" class="link">Neue Gruppe</button>
    </div>
    <ul id="chatList" class="list"></ul>
    <div id="emptyList" class="empty">Noch keine Chats</div>
  </section>

  <!-- Chat -->
  <section id="viewChat" class="view hidden">
    <button id="chatHead" class="chathead" title="Infos">
      <span id="chatAvatar"></span>
      <span class="fmeta">
        <span class="fname" id="chatName"></span>
        <span class="flast" id="chatSub"></span>
      </span>
    </button>
    <div id="messages" class="messages"></div>
    <div id="emojiPanel" class="emoji-panel hidden">
      <div id="emojiTabs" class="emoji-tabs"></div>
      <div id="emojiGrid" class="emoji-grid"></div>
    </div>
    <form id="sendForm" class="composer">
      <button type="button" id="emojiBtn" class="ic" title="Emojis"><svg><use href="#i-smile"/></svg></button>
      <button type="button" id="attachBtn" class="ic" title="Bild oder GIF"><svg><use href="#i-clip"/></svg></button>
      <input id="msgInput" placeholder="Nachricht" autocomplete="off" maxlength="4000">
      <button class="send" type="submit" title="Senden"><svg><use href="#i-send"/></svg></button>
    </form>
    <div id="dropHint" class="drop-hint hidden">Bild hier ablegen</div>
  </section>

  <!-- Einstellungen -->
  <section id="viewSettings" class="view hidden">
    <div class="settings">
      <h2>Profil</h2>
      <div class="profile-head">
        <span id="profAvatar"></span>
        <div class="profile-actions">
          <button id="avatarChange" class="link">Bild ändern</button>
          <button id="avatarRemove" class="link muted-link">Entfernen</button>
        </div>
      </div>
      <div class="field">Profilrahmen<div id="frameGrid" class="frame-grid"></div></div>
      <label class="field">Name<input id="profName" maxlength="24" autocomplete="off"></label>
      <label class="field">Status<input id="profStatus" maxlength="80" placeholder="Optional" autocomplete="off"></label>
      <div class="setting">
        <span>Dein Code</span>
        <span class="row-end"><span class="code-sm" id="profCode"></span>
          <button id="profCopy" class="ic small-ic" title="Kopieren"><svg><use href="#i-copy"/></svg></button></span>
      </div>
      <button id="profSave" class="primary full hidden">Speichern</button>

      <h2>Darstellung</h2>
      <div class="segmented" id="themeSeg">
        <button data-theme="system">System</button>
        <button data-theme="light">Hell</button>
        <button data-theme="dark">Dunkel</button>
      </div>

      <h2>Benachrichtigungen</h2>
      <label class="setting"><span>Benachrichtigungen</span><input type="checkbox" class="switch" id="setNotify"></label>
      <label class="setting"><span>Ton</span><input type="checkbox" class="switch" id="setSound"></label>
      <label class="setting"><span>Nachricht in der Vorschau zeigen</span><input type="checkbox" class="switch" id="setPreview"></label>
      <div class="setting"><span class="muted">Wie sieht das aus?</span><button id="notifyTest" class="link">Test senden</button></div>

      <h2>Allgemein</h2>
      <label class="setting"><span>Beim Schließen im Hintergrund weiterlaufen</span><input type="checkbox" class="switch" id="setBackground"></label>
      <label class="setting" id="loginRow"><span>Mit Windows starten</span><input type="checkbox" class="switch" id="setLogin"></label>
      <label class="setting"><span>Immer im Vordergrund</span><input type="checkbox" class="switch" id="setPin"></label>

      <h2>Updates</h2>
      <div class="setting"><span>Version</span><span class="muted" id="appVersion">–</span></div>
      <label class="setting"><span>Beim Start nach Updates suchen</span><input type="checkbox" class="switch" id="setAutoUpdate"></label>
      <div class="update-box">
        <div class="muted" id="updateStatus"></div>
        <div class="bar hidden" id="updateBar"><div id="updateFill"></div></div>
        <button id="updateBtn" class="primary full">Nach Updates suchen</button>
      </div>

      <h2>Info</h2>
      <div class="setting"><span>Quellcode & Downloads</span><button id="repoLink" class="link">GitHub</button></div>
    </div>
  </section>

  <!-- Erfolge -->
  <section id="viewAchievements" class="view hidden">
    <div class="ach-summary">
      <span><span id="achCount">0</span> / <span id="achTotal">0</span></span>
      <div class="bar"><div id="achBar"></div></div>
    </div>
    <ul id="achList" class="ach-list"></ul>
  </section>

  <div id="modal" class="modal hidden"><div id="modalBox" class="modal-box"></div></div>
  <div id="viewer" class="viewer hidden">
    <img id="viewerImg" alt="">
    <div class="viewer-actions">
      <a id="viewerSave" class="link">Speichern</a>
      <button id="viewerClose" class="link">Schließen</button>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <input type="file" id="fileInput" accept="image/*" hidden>
  <input type="file" id="avatarInput" accept="image/*" hidden>

  <script src="../node_modules/peerjs/dist/peerjs.min.js"></script>
  <script src="emojis.js"></script>
  <script src="achievements.js"></script>
  <script src="frames.js"></script>
  <script src="app.js"></script>
</body>
</html>
